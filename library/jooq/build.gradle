plugins {
    id("nu.studer.jooq") version "8.2.3"
}

apply plugin: "io.spring.dependency-management"
apply plugin: "org.springframework.boot"

jar {
    enabled = true
}

bootJar {
    enabled = false
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/generated-jooq'
        }
    }
}

dependencies {
    // JOOQ versions will be managed by Spring Boot BOM
    jooqGenerator 'org.jooq:jooq-meta-extensions-hibernate'
    jooqGenerator 'org.jooq:jooq-meta'
    jooqGenerator 'org.jooq:jooq'

    jooqGenerator project(':library:model')
    compileOnly project(':library:model')

    runtimeOnly "org.postgresql:postgresql"
    jooqGenerator "org.postgresql:postgresql"

    api 'org.springframework.boot:spring-boot-starter-jooq'
}

test {
    useJUnitPlatform()
}

// Spring/JOOQ: use env vars (Heroku JDBC_* or split DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD)
def jdbcUrl = System.getenv('JDBC_DATABASE_URL') ?: "jdbc:postgresql://${System.getenv('DB_HOST') ?: 'localhost'}:${System.getenv('DB_PORT') ?: '5432'}/${System.getenv('DB_NAME') ?: 'postgres'}"
def jdbcUser = System.getenv('JDBC_DATABASE_USERNAME') ?: System.getenv('DB_USER') ?: 'postgres'
def jdbcPassword = System.getenv('JDBC_DATABASE_PASSWORD') ?: System.getenv('DB_PASSWORD') ?: 'example'

jooq {
    version = dependencyManagement.importedProperties['jooq.version']
    edition = nu.studer.gradle.jooq.JooqEdition.OSS
    configurations {
        main {
            generationTool {
                logging = org.jooq.meta.jaxb.Logging.WARN
                jdbc {
                    driver = 'org.postgresql.Driver'
                    url = jdbcUrl
                    user = jdbcUser
                    password = jdbcPassword
                }
                generator {
                    generate {
                        javadoc = false
                        keys = false
                        records = false
                        sequences = false
                        sequenceFlags = false
                        routines = false
                        pojos = true
                        pojosAsJavaRecordClasses = true
                    }
                    database {
                        schemata {
                            schema {
                                inputSchema = "public"
                            }
                            schema {
                                inputSchema = "survey"
                            }
                        }
                    }

                    name = 'org.jooq.codegen.DefaultGenerator'
                    database {
                        name = 'org.jooq.meta.postgres.PostgresDatabase'

                        includes = '.*'
                        excludes = """
                  """
                    }
                    target {
                        packageName = 'kz.survey.library.jooq.survey.ddl'
                        directory = 'src/main/generated-jooq'
                    }
                }
            }
        }
    }
}

// Skip on Heroku/CI (no DB at build time). Run with -PrunJooqGeneration=true when schema changes.
tasks.named('generateJooq').configure {
    enabled = (project.findProperty('runJooqGeneration') == 'true')
}
