spring:
  application:
    name: survey
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:example}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        generate_statistics: true
        bytecode:
          use_reflection_optimizer: true
        show_sql: false
    open-in-view: false
  config:
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8889/}
  main:
    allow-bean-definition-overriding: true
  cloud:
    config:
      fail-fast: true
  threads:
    virtual:
      enabled: true
server:
  port: ${PORT:8070}

# CORS: allowed origins for browser requests (e.g. frontend on another port)
# Defaults allow localhost:3000, 4200, 5173, 8080
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:4200,http://127.0.0.1:5173,http://127.0.0.1:8080}

management:
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.99, 0.95, 0.9, 0.7, 0.5
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 300ms,500ms,1s,2s
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: prometheus, metrics
# Swagger / OpenAPI (SpringDoc)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false