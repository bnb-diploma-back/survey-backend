plugins {
    id 'java'
    id("org.springframework.boot") version "4.0.2" apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id "com.gorylenko.gradle-git-properties" version "2.5.2" apply false
}


allprojects {
    apply plugin: "java"
    apply plugin: "io.spring.dependency-management"
    apply plugin: "org.springframework.boot"

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.2"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.0"
        }
    }


    group = 'kz.survey'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    compileTestJava.options.encoding = "UTF-8"

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.compilerArgs += ['-parameters'] // optional, keeps parameter names
        options.incremental = true
    }

    tasks.withType(Test).configureEach {
        jvmArgs += [
                "--enable-preview"
        ]

        testLogging {
            events "passed", "failed", "skipped"
        }
    }

    tasks.withType(JavaExec).configureEach {
        jvmArgs += "--enable-preview"
    }

    test {
        useJUnitPlatform()
        testLogging {
            afterSuite { desc, result ->
                if (!desc.parent) { // will match the outermost suite
                    println "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
                }
            }
        }
    }

    compileJava {
        options.compilerArgs += ['-parameters']
        options.incremental = true
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    // Only :laucher has a main class; disable bootJar for all other projects
    bootJar {
        enabled = false
    }
    jar {
        enabled = true
    }
}

// Copy laucher boot JAR to root build/libs for Heroku Procfile
tasks.named('build').configure {
    dependsOn(':laucher:bootJar')
    doLast {
        copy {
            from project(':laucher').tasks.getByName('bootJar')
            into file('build/libs')
            rename { 'survey-back.jar' }
        }
    }
}
